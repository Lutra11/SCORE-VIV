name: Run experiment

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment family to run
        required: true
        type: choice
        default: E1_fem_viv_validation
        options:
          - E1_fem_viv_validation
          - E2_scour_validation
          - E3_scour_fem_viv_coupling
          - E4_fatigue_validation
          - E5_multifidelity_surrogate
          - E6_reliability_na_qae
          - E7_mitigation_optimization
          - E8_ablation
          - E9_sensitivity
      config:
        description: Path relative to the selected experiment directory
        required: true
        type: string
        default: configs/default.yaml
      seed:
        description: Reproducible random seed
        required: true
        type: string
        default: "20261103"
      dry_run:
        description: Validate dispatch without executing numerical work
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: score-viv-${{ github.ref }}-${{ inputs.experiment }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EXPERIMENT_DIR: experiments/${{ inputs.experiment }}
      OUTPUT_DIR: experiments/${{ inputs.experiment }}/outputs
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Restore raw dataset cache
        uses: actions/cache@v4
        with:
          path: dataset/raw
          key: score-viv-dataset-${{ runner.os }}-${{ hashFiles('dataset/manifests/**') }}
          restore-keys: |
            score-viv-dataset-${{ runner.os }}-

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt
          python -m pip install -e .

      - name: Run selected experiment
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIG_PATH: ${{ inputs.config }}
          RUN_SEED: ${{ inputs.seed }}
        run: |
          args=(
            --config "$EXPERIMENT_DIR/$CONFIG_PATH"
            --output-dir "$OUTPUT_DIR"
            --seed "$RUN_SEED"
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python "$EXPERIMENT_DIR/run.py" "${args[@]}"

      - name: Upload experiment artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.experiment }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 14

